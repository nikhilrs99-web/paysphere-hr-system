version: '3.8'

services:
  backend:
    build:
      context: ./hr-backend
      dockerfile: Dockerfile
    container_name: paysphere-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: unless-stopped

  frontend:
    build:
      context: ./hr-frontend
      dockerfile: Dockerfile
    container_name: paysphere-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
